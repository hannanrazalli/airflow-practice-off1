version: 2

models:
  - name: dim_accounts
    columns:
      - name: account_key
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: account_id
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

  - name: fct_transactions
    columns:
      - name: account_key
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_key

      - name: transaction_id
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: account_id
        tests:
          - not_null:
              config:
                severity: error