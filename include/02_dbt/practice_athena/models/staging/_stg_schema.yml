version: 2

models:
  - name: stg_accounts
    columns:
      - name: account_id
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: account_status
        tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'SUSPENDED']

  - name: stg_txn
    columns:
      - name: transaction_id
        tests:
          - not_null:
              config:
                severity: error