name: CI Ujian Asas DAG

# 1. BILA pengawal ini patut bekerja?
on:
  push:
    branches:
      - main  # (atau 'master', bergantung pada nama branch kau)

# 2. APA yang pengawal ini patut buat?
jobs:
  semak-kod:
    runs-on: ubuntu-latest  # GitHub sediakan server Linux percuma untuk test kod
    
    steps:
      # Langkah A: Sedut kod kau ke dalam server percuma ini
      - name: Tarik kod dari repositori
        uses: actions/checkout@v3

      # Langkah B: Pasang Python (kerana Airflow guna Python)
      - name: Sediakan persekitaran Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Langkah C: Ujian sebenar - Cari ralat sintaks (typo/indentasi)
      - name: Semak ralat sintaks pada fail DAG
        run: |
          python -m py_compile dags/*.py