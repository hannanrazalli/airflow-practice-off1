name: CI test

on:
  push:
    branches:
      - main

jobs:
  code_linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ruff sqlfluff

      - name: Run test
        run: ruff check dags/ include/