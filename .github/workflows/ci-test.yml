name: CI test

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  code_linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install ruff sqlfluff

      - name: Run test
        run: ruff check dags/ include/

  airflow_dagbag_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install apache-airflow
          pip install -r requirements.txt

      - name: Run test
        run: |
          airflow db migrate
          python -c "
          from airflow.models import DagBag
          dagbag = DagBag(dag_folder='dags/')
          assert len(dagbag.import_errors) == 0, f'DAG Import Errors: {dagbag.import_errors}'
          print('✅ All DAGs successfully uploaded without logic error.')
          "

  dbt_parse_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install dbt-core dbt-athena-community

      - name: Run dbt Parse
        run: |
          cd include/02_dbt/practice_athena
          
          cat << EOF > profiles.yml
          practice_athena:
            target: dev
            outputs:
              dev:
                type: athena
                s3_staging_dir: s3://dummy-bucket/
                region_name: ap-southeast-1
                schema: dummy_schema
                database: awsdatacatalog
          EOF
          
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .